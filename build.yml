name: Build bb-probe.exe

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Get this repo (modified source files)
        uses: actions/checkout@v4

      - name: Set up MSYS2 CLANG64
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git make unzip zip python
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-SDL3
            mingw-w64-clang-x86_64-vulkan-headers
            mingw-w64-clang-x86_64-vulkan-loader
            mingw-w64-clang-x86_64-openssl
            mingw-w64-clang-x86_64-protobuf
            mingw-w64-clang-x86_64-abseil-cpp
            mingw-w64-clang-x86_64-ffmpeg
            mingw-w64-clang-x86_64-zlib
            mingw-w64-clang-x86_64-zstd
            mingw-w64-clang-x86_64-nlohmann-json
            mingw-w64-clang-x86_64-miniupnpc
            mingw-w64-clang-x86_64-libwinpthread

      - name: Fetch upstream source (windows-v1.6)
        shell: msys2 {0}
        run: |
          git clone --recursive https://github.com/Supermedo/bloodborne_pc.git upstream
          cd upstream
          git checkout windows-v1.6
          git submodule update --init --recursive
          echo "---- upstream packaging notes ----"
          cat packaging/windows/README.md || true

      - name: Apply modified files
        shell: msys2 {0}
        run: |
          cp mod_source/runtime_pad.c upstream/src/runtime_pad.c
          cp mod_source/runtime_services.c upstream/src/runtime_services.c
          cp mod_source/build.sh upstream/build.sh

      - name: Build
        shell: msys2 {0}
        run: |
          cd upstream
          bash build.sh

      - name: Collect output
        shell: msys2 {0}
        run: |
          mkdir dist
          cp upstream/out/bb-probe.exe dist/
          ldd upstream/out/bb-probe.exe | grep -i clang64 | awk '{print $3}' | xargs -r cp -n -t dist/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: bb-probe
          path: dist/
